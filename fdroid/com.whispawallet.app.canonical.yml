    subdir: android/app
    sudo:
      - curl -Lo node.tar.xz https://nodejs.org/dist/v20.20.2/node-v20.20.2-linux-x64.tar.xz
      - echo 'df770b2a6f130ed8627c9782c988fda9669fa23898329a61a871e32f965e007d  node.tar.xz'
