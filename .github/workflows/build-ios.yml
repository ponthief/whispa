name: Build iOS

# DO NOT DELETE THIS WORKFLOW.
#
# It was deleted once, in b6d56c4, on a misreading of "just apks.. no need for
# ios" — which meant "do not extend the new mainnet work to iOS", not "remove
# the iOS build". Restoring it cost more than leaving it would have, and iOS
# went un-built in the meantime. If iOS CI is ever genuinely unwanted, disable
# the triggers below and say so here; do not remove the file.
#
# Builds the iOS app on a macOS runner. Two modes, and which one you get
# depends entirely on whether the Apple signing secrets exist:
#
#   no secrets  → builds an UNSIGNED simulator .app, zipped with the bundle at
#                 the archive root. Needs no Apple Developer account at all.
#                 Runs in a local simulator and in a device cloud's simulator
#                 session (LambdaTest takes this zip directly).
#   secrets set → archives and exports a signed .ipa you can install on a
#                 registered physical device.
#
# The simulator path is not a consolation prize, but it is not a substitute for
# the signed one either. Simulators do not enforce code signing, so an unsigned
# .app is genuinely testable there; real devices enforce it absolutely, accept
# only a signed .ipa, and an iOS build cannot be signed with a throwaway key
# the way an Android one can. So: unsigned covers simulators, and nothing else
# covers hardware.
#
# Secrets, when you want the .ipa (see BUILD_IOS.md for how to produce each):
#
#   APPLE_CERTIFICATE_P12         base64 of an exported Apple Distribution or
#                                 Development certificate (.p12)
#   APPLE_CERTIFICATE_PASSWORD    its export password
#   APPLE_PROVISIONING_PROFILE    base64 of the matching .mobileprovision
#   APPLE_TEAM_ID                 10-character team id
#
# GOOGLE_SERVICES_PLIST_IOS is separate and optional: base64 of
# GoogleService-Info.plist. Without it the app builds without push, exactly as
# the Android workflow does without google-services.json.

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Which backend the app talks to
        type: choice
        options: [signet, mainnet]
        default: signet
      exportMethod:
        description: >-
          How to export the .ipa. development installs on devices in your
          provisioning profile; ad-hoc is the same but for a distribution
          profile; app-store produces something only App Store Connect accepts.
          Ignored when the signing secrets are absent.
        type: choice
        options: [development, ad-hoc, app-store]
        default: development
  push:
    # master only. The bring-up branch that used to be listed here existed
    # because GitHub offers workflow_dispatch only for workflows already on the
    # default branch, so a brand new workflow could not be triggered until it
    # was merged. It is merged, so the workaround is gone.
    branches: [master]
    paths:
      # Only when something that can break the iOS build changes. A JS-only
      # commit cannot fail this, and macOS runner minutes are billed at ten
      # times the Linux rate on private repositories.
      - 'ios/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-ios.yml'

# NOTE ON THE NAMES BELOW. Thrilla.xcworkspace, `-scheme Thrilla`,
# ios/Thrilla/, Thrilla.app and Thrilla.xcarchive are what the Xcode project is
# actually called on disk — renaming them here without renaming the project
# breaks the build. com.thrilla-btc.thrilla is the app's bundle identifier,
# which is its identity to the App Store and to every device that installs it.
# Neither is copy, and neither is part of the WhiSPa rename.

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # macos-14 images carry several Xcodes; the default is not always the
      # newest. Pin it so a runner-image update cannot silently change the
      # toolchain under a wallet build.
      - name: Select Xcode
        run: |
          ls /Applications | grep -i '^Xcode' || true
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer \
            || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - run: npm ci

      # Optional, and deliberately before pod install: the Firebase pods are
      # already in the Podfile via package.json, so the plist only decides
      # whether push works at runtime, not whether the app links.
      - name: Configure Firebase, if the secret is set
        id: firebase
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICES_PLIST_IOS }}
        run: |
          if [ -z "${PLIST:-}" ]; then
            echo "GOOGLE_SERVICES_PLIST_IOS not set — building without push notifications."
            echo "push=off" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$PLIST" | base64 -d > ios/Thrilla/GoogleService-Info.plist
          # A mangled secret must fail here rather than at runtime, where it
          # shows up as push silently never arriving.
          plutil -lint ios/Thrilla/GoogleService-Info.plist \
            || { echo "::error::GOOGLE_SERVICES_PLIST_IOS did not base64-decode to a valid plist — most likely a truncated paste."; exit 1; }
          BUNDLE="$(plutil -extract BUNDLE_ID raw ios/Thrilla/GoogleService-Info.plist 2>/dev/null || echo '')"
          echo "GoogleService-Info.plist is for bundle id: ${BUNDLE:-unknown}"
          echo "push=on" >> "$GITHUB_OUTPUT"
          # NOTE this file still has to be a member of the Xcode target to be
          # copied into the app. That is tracked in BUILD_IOS.md; decoding it
          # here is necessary but not by itself sufficient.

      - name: Cache Pods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          # react-native.config.js belongs in the key: it decides which packages
          # use_native_modules! links, so a change to it changes the Pods tree.
          # Left out, a restored cache can keep pods that have since been
          # excluded — which is exactly the CapacitorCordova that broke the
          # first build.
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile', 'package-lock.json', 'react-native.config.js') }}
          restore-keys: pods-${{ runner.os }}-

      - name: pod install
        working-directory: ios
        run: |
          pod install --repo-update 2>&1 | tail -40
          test -d Thrilla.xcworkspace || { echo "::error::pod install produced no workspace."; exit 1; }

      # Is there anything to sign with? Everything downstream branches on this.
      - name: Import the signing certificate, if the secrets are set
        id: signing
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "${CERT:-}" ]; then
            echo "::notice::No Apple signing secrets — compiling for the simulator only. No installable .ipa is possible without them."
            echo "mode=simulator" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Named explicitly rather than derived from the variable name: a
          # clever ${v#CERT_} expansion turned APPLE_CERTIFICATE_PASSWORD into
          # "APPLE_PASSWORD" in the error message, sending you to look for a
          # secret that does not exist.
          check() { [ -n "$2" ] || { echo "::error::APPLE_CERTIFICATE_P12 is set but $1 is not. Signing needs the certificate, its password, a matching provisioning profile and the team id."; exit 1; }; }
          check APPLE_CERTIFICATE_PASSWORD "${CERT_PASSWORD:-}"
          check APPLE_PROVISIONING_PROFILE  "${PROFILE:-}"
          check APPLE_TEAM_ID               "${TEAM_ID:-}"

          # A throwaway keychain, not the login one: it is created here,
          # unlocked with a password that exists only for this job, and thrown
          # away at the end. Nothing persists on the runner.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$CERT" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN" \
            || { echo "::error::Could not import the certificate. Usually APPLE_CERTIFICATE_PASSWORD is wrong; failing that, APPLE_CERTIFICATE_P12 is a truncated paste or is not a .p12 export."; exit 1; }
          # Without this, codesign blocks on a GUI prompt that no one can
          # answer and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

          echo "Identities available to codesign:"
          security find-identity -v -p codesigning "$KEYCHAIN" | sed 's/^/  /'
          # find-identity always ends with "N valid identities found", so
          # matching that phrase matches success too — an earlier version of
          # this check failed every signed build. Match the zero.
          if security find-identity -v -p codesigning "$KEYCHAIN" | grep -qE '^[[:space:]]*0 valid identities found'; then
            echo "::error::The certificate imported but no valid codesigning identity resulted. An Apple *certificate* on its own is not enough: the .p12 must contain its private key. Re-export from Keychain Access with both the certificate AND the key selected."
            exit 1
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$PROFILE" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
          # The profile's UUID is the name Xcode looks it up by.
          UUID="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" 2>/dev/null \
                  | plutil -extract UUID raw - 2>/dev/null || echo '')"
          if [ -z "$UUID" ]; then
            echo "::error::Could not read a UUID from APPLE_PROVISIONING_PROFILE — it is probably not a .mobileprovision, or the paste is truncated."
            exit 1
          fi
          cp "$RUNNER_TEMP/profile.mobileprovision" \
             "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

          NAME="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" 2>/dev/null | plutil -extract Name raw - 2>/dev/null || echo '')"
          APPID="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" 2>/dev/null | plutil -extract Entitlements.application-identifier raw - 2>/dev/null || echo '')"
          echo "Provisioning profile: ${NAME:-?}  ($UUID)"
          echo "Covers application-identifier: ${APPID:-?}"
          # The profile must actually cover the bundle id being built, or the
          # export fails late with a message that names neither.
          case "$APPID" in
            *com.thrilla-btc.thrilla|*'*') : ;;
            *) echo "::warning::The profile covers '$APPID', which does not obviously match com.thrilla-btc.thrilla. If the export fails, this is why." ;;
          esac

          {
            echo "SIGNING_KEYCHAIN=$KEYCHAIN"
            echo "PROFILE_UUID=$UUID"
            echo "PROFILE_NAME=$NAME"
            echo "APPLE_TEAM_ID=$TEAM_ID"
          } >> "$GITHUB_ENV"
          echo "mode=signed" >> "$GITHUB_OUTPUT"

      - name: Resolve build parameters
        id: params
        run: |
          FLAVOR="${{ inputs.flavor || 'signet' }}"
          echo "flavor=$FLAVOR" >> "$GITHUB_OUTPUT"
          echo "ENVFILE=.env.$FLAVOR" >> "$GITHUB_ENV"
          echo "Building the $FLAVOR flavour."
          # Exported now, but NOT yet effective. On Android the flavour picks
          # its env file through envConfigFiles in build.gradle; on iOS
          # react-native-config reads ENVFILE from a build phase that this
          # project does not have yet, so both flavours currently compile with
          # whatever the default is. Wiring that up, and giving signet its own
          # bundle id so the two can sit side by side, is the next step — see
          # BUILD_IOS.md. Until then, treat the flavour input as a label.
          echo "::warning::The flavour input does not yet change what is built on iOS: react-native-config's build phase is not wired up. See BUILD_IOS.md."

      # ---- unsigned path: a simulator .app you can actually run -----------
      # Unsigned is not only a compile check. Simulators do not enforce code
      # signing, so an unsigned .app is a testable artifact — device clouds
      # (LambdaTest among them) take a zipped .app for simulator sessions. Real
      # devices still need the signed .ipa below; there is no way around that.
      - name: Build for the simulator
        if: steps.signing.outputs.mode == 'simulator'
        working-directory: ios
        run: |
          set -o pipefail
          # No -arch: Release leaves ONLY_ACTIVE_ARCH off, so this builds the
          # standard simulator set (arm64 and x86_64) and runs on an Apple
          # silicon or an Intel simulator host alike. Pinning -arch arm64 would
          # satisfy the clouds that require arm64 and break the ones that do
          # not have it, so the set is verified below rather than narrowed.
          xcodebuild \
            -workspace Thrilla.xcworkspace \
            -scheme Thrilla \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tail -60
          APP="$(find build -name 'Thrilla.app' -maxdepth 6 | head -1)"
          test -n "$APP" || { echo "::error::the build reported success but produced no Thrilla.app"; exit 1; }
          echo "Built $APP"
          echo "Bundled fonts in the app:"
          ls "$APP" | grep -i '\.ttf' || echo "  (none — fonts are not in Copy Bundle Resources yet; see BUILD_IOS.md)"

          # Read the executable's name rather than assuming it matches the
          # bundle's: PRODUCT_NAME and the .app name are separate settings, and
          # a wrong guess here would make lipo fail on a perfectly good build.
          EXE="$(plutil -extract CFBundleExecutable raw "$APP/Info.plist" 2>/dev/null || echo Thrilla)"
          ARCHS="$(lipo -archs "$APP/$EXE" 2>/dev/null || echo '?')"
          echo "Architectures in the binary: $ARCHS"
          case "$ARCHS" in
            *arm64*) : ;;
            *) echo "::error::the simulator binary has no arm64 slice ($ARCHS). Device clouds that run simulators on Apple silicon — LambdaTest requires this — will reject it."; exit 1 ;;
          esac

          # The .app bundle has to sit at the ROOT of the archive, not inside a
          # build directory, or the upload is rejected as not an app. ditto
          # --keepParent does exactly that and, unlike `zip`, preserves the
          # symlinks and resource forks inside a bundle.
          mkdir -p build/upload
          ditto -c -k --sequesterRsrc --keepParent "$APP" build/upload/Thrilla-simulator.zip
          unzip -l build/upload/Thrilla-simulator.zip | head -5
          ls -lh build/upload/Thrilla-simulator.zip

      # ---- signed path: archive and export an .ipa ------------------------
      - name: Archive
        if: steps.signing.outputs.mode == 'signed'
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Thrilla.xcworkspace \
            -scheme Thrilla \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Thrilla.xcarchive \
            -derivedDataPath build \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_STYLE=Manual \
            archive 2>&1 | tail -60
          test -d build/Thrilla.xcarchive || { echo "::error::archive step produced no .xcarchive"; exit 1; }

      - name: Export the .ipa
        if: steps.signing.outputs.mode == 'signed'
        working-directory: ios
        run: |
          set -o pipefail
          cat > build/export.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${{ inputs.exportMethod || 'development' }}</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.thrilla-btc.thrilla</key><string>$PROFILE_NAME</string>
            </dict>
            <key>compileBitcode</key><false/>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Thrilla.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/export.plist 2>&1 | tail -40
          IPA="$(find build/export -name '*.ipa' | head -1)"
          test -n "$IPA" || { echo "::error::export produced no .ipa"; exit 1; }
          echo "ipa=$IPA" >> "$GITHUB_ENV"
          ls -lh "$IPA"

      - name: Report what signed it
        if: steps.signing.outputs.mode == 'signed'
        working-directory: ios
        run: |
          APP="$(find build/Thrilla.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)"
          echo "Code signature:"
          codesign -dv --verbose=2 "$APP" 2>&1 | sed 's/^/  /' || true
          echo "Entitlements:"
          codesign -d --entitlements :- "$APP" 2>/dev/null | plutil -p - 2>/dev/null | sed 's/^/  /' || true

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.mode == 'signed'
        with:
          name: whispa-ios-${{ steps.params.outputs.flavor }}-${{ github.sha }}
          path: ios/${{ env.ipa }}
          retention-days: 14

      # The simulator build used to be thrown away. It is the artifact you
      # upload for a simulator session on a device cloud, so keep it.
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.mode == 'simulator'
        with:
          name: whispa-ios-simulator-${{ steps.params.outputs.flavor }}-${{ github.sha }}
          path: ios/build/upload/Thrilla-simulator.zip
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          {
            echo "### iOS build"
            echo
            if [ "${{ steps.signing.outputs.mode }}" = "signed" ]; then
              echo "Signed \`.ipa\` attached to this run, exported as **${{ inputs.exportMethod || 'development' }}**."
              echo
              echo "Install it with Apple Configurator, or \`xcrun devicectl device install app --device <udid> <ipa>\`. The device must be in the provisioning profile."
            else
              echo "**Unsigned simulator build** — \`Thrilla-simulator.zip\` attached to this run."
              echo
              echo "Run it locally with \`xcrun simctl install booted Thrilla.app\`, or upload the zip as-is to a device cloud's *simulator* app slot (LambdaTest: **App Automation → Upload**, or its REST upload endpoint). The \`.app\` is at the root of the archive and carries an arm64 slice, which is what those uploads check."
              echo
              echo "**Real iOS devices cannot run this.** They accept only a signed \`.ipa\`, and an iOS build cannot be signed with a throwaway key the way an Android one can — that needs real Apple credentials: \`APPLE_CERTIFICATE_P12\`, \`APPLE_CERTIFICATE_PASSWORD\`, \`APPLE_PROVISIONING_PROFILE\` and \`APPLE_TEAM_ID\`. See \`BUILD_IOS.md\`."
            fi
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| flavour | ${{ steps.params.outputs.flavor }} |"
            echo "| mode | ${{ steps.signing.outputs.mode }} |"
            echo "| push notifications | ${{ steps.firebase.outputs.push }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the keychain and profile
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" 2>/dev/null || true
          fi
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID:-none}.mobileprovision"
          rm -f ios/Thrilla/GoogleService-Info.plist
