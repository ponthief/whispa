apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// react-native-config: reads a per-network env file and generates
// BuildConfig/resValue entries exposed to JS as `Config.*` (the mobile analog of
// the web build's `vite build --mode <net>` + .env.<net>).
//
// The file is chosen by the BUILD FLAVOR (see productFlavors below) via
// envConfigFiles — keyed by "<flavor><buildType>". This is robust across the
// Gradle daemon, unlike the ENVFILE env var, which a cached daemon may not pick
// up (that's why `ENVFILE=.env.signet` alone kept building mainnet). ENVFILE
// still overrides if explicitly set; defaultEnvFile is the last-resort fallback.
project.ext.envConfigFiles = [
    mainnetdebug:   ".env.mainnet",
    mainnetrelease: ".env.mainnet",
    signetdebug:    ".env.signet",
    signetrelease:  ".env.signet",
]
project.ext.defaultEnvFile = ".env.mainnet"
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

// Diagnostic: prints the network config actually baked into this build. Look for
// this line (and react-native-config's "Reading env from: …") in the Gradle log
// to confirm you built the flavor you intended.
println "🔧 Thrilla build config → NETWORK_LOCK=${project.env?.NETWORK_LOCK}  LNBITS_URL=${project.env?.LNBITS_URL}"

// ── the app version, read from the repo rather than repeated here ────────────
//
// package.json's "version" is canonical; src/version.ts mirrors it because the
// JS bundle needs a literal it can import. Both are read, and a mismatch is a
// failed build — bumping one and forgetting the other cannot reach a phone.
//
// Every failure here is fatal on purpose. A build that cannot establish the
// version must not fall back to a guess and ship a wrong one, which is exactly
// how "0.2.0" got in front of users while v0.1.4 was the newest release anyone
// could install.
def appVersionName = { ->
    def pkg = file("${rootDir}/../package.json")
    if (!pkg.exists()) {
        throw new GradleException(
            "The app version is read from package.json, and it is not at ${pkg}."
        )
    }
    def fromPkg = new groovy.json.JsonSlurper().parseText(pkg.text).version
    if (!(fromPkg ==~ /^\d+\.\d+\.\d+$/)) {
        throw new GradleException(
            "package.json version is '${fromPkg}'; it must be x.y.z so that a " +
            "versionCode can be derived from it."
        )
    }

    def ts = file("${rootDir}/../src/version.ts")
    if (!ts.exists()) {
        throw new GradleException(
            "src/version.ts is missing; the app reports its version from it."
        )
    }
    def m = ts.text =~ /export const APP_VERSION = '([^']+)'/
    if (!m) {
        throw new GradleException(
            "Could not find APP_VERSION in ${ts}. It must stay a plain literal " +
            "(export const APP_VERSION = 'x.y.z') so this build can check it " +
            "against package.json."
        )
    }
    def fromTs = m[0][1]
    if (fromTs != fromPkg) {
        throw new GradleException(
            "Version mismatch: package.json says ${fromPkg}, src/version.ts " +
            "says ${fromTs}. Set both to the same x.y.z — the second is what " +
            "the About page and the update check report."
        )
    }
    return fromPkg
}()

// x.y.z -> x*10000 + y*100 + z. Monotonic for any version that only goes up,
// and every value it produces clears the hand-set 2 that shipped before.
def appVersionCode = {
    def (major, minor, patch) = appVersionName.tokenize('.').collect { it as int }
    if (minor > 99 || patch > 99) {
        throw new GradleException(
            "Version ${appVersionName} does not fit this scheme: minor and patch " +
            "must stay under 100, or the derived versionCode stops increasing."
        )
    }
    return major * 10000 + minor * 100 + patch
}()

println "🔧 Thrilla version → ${appVersionName} (versionCode ${appVersionCode})"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    // root = file("../")
    //   The folder where the react-native NPM package is. Default is ../node_modules/react-native
    // reactNativeDir = file("../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../node_modules/@react-native/codegen
    // codegenDir = file("../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../node_modules/react-native/cli.js
    // cliFile = file("../node_modules/react-native/cli.js")

    /* Variants */
    //   Debug variants skip JS bundling (they load from Metro). With flavors the
    //   debug variants are named per-flavor, so they must be listed explicitly.
    debuggableVariants = ["mainnetDebug", "signetDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

// ── Release signing, resolved ONCE ──────────────────────────────────────────
//
// Two things need this answer and they MUST NOT compute it separately:
// `signingConfigs.release` fills the config, and `buildTypes.release` decides
// whether to use it or fall back to debug. They were two expressions, and on
// 2026-10-16 they stopped agreeing — the config was taught to read WHISPA_*
// with a THRILLA_* fallback and the selector was left asking
// `hasProperty('THRILLA_STORE_FILE')`. CI sets only WHISPA_*, so the selector
// said no, every release APK came out DEBUG-SIGNED, and the workflow's
// "Verify what signed it" step refused to publish it. Thirty-one red runs.
//
// So there is one resolution and one boolean, read in both places.
//
// NON-BLANK, NOT DEFINED, and that is the other half of the same bug. An
// unset GitHub secret interpolates to `ORG_GRADLE_PROJECT_WHISPA_STORE_FILE=`,
// which DEFINES the property with an empty value — `hasProperty` is true and
// `file('')` throws "path may not be null or empty string". All four have to
// be non-blank, so a half-configured environment falls back to debug signing
// rather than failing the build.
//
// WHISPA_* first, THRILLA_* behind it: the rename does not reach a machine
// whose gradle.properties nobody has edited yet.
def releaseSigningProp = { n -> (project.findProperty(n) ?: '').toString().trim() }
ext.releaseSigning = [
    'STORE_FILE', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD',
].collectEntries { n ->
    [(n): releaseSigningProp("WHISPA_$n") ?: releaseSigningProp("THRILLA_$n")]
}
ext.releaseSigningReady = releaseSigning.every { k, v -> v }

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.thrilla_btc.thrilla"
    defaultConfig {
        applicationId "com.whispawallet.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Both read from package.json, which is the only place the version is
        // written. It used to be repeated here and in the About page, and the
        // three agreeing was mistaken for them being right: they said "0.2.0"
        // while the published releases were on v0.1.4, so the About page named
        // a version nobody could download. See src/version.ts.
        //
        // versionCode must strictly increase or Android refuses the update, so
        // it is derived rather than remembered: 0.1.5 -> 105, 1.2.3 -> 10203.
        // It sat at 1 through every early release, which is why installing over
        // an existing build was a reinstall rather than an upgrade, and then at
        // a hand-set 2. Every derived code is far above both.
        versionCode appVersionCode
        versionName appVersionName

        // react-native-config resolves Config.* at runtime from
        // "<package>.BuildConfig" using getPackageName() (the applicationId).
        // The signet flavor adds applicationIdSuffix ".signet", so that lookup
        // would target com.thrilla_btc.thrilla.signet.BuildConfig, which does
        // NOT exist — BuildConfig is generated under the namespace. Pin the
        // lookup to the namespace so Config.* resolves for every flavor.
        resValue "string", "build_config_package", "com.thrilla_btc.thrilla"

        // reactNativeArchitectures alone does NOT control what lands in the APK.
        // It filters React Native's own native build — RN and Hermes — and
        // nothing else. Every prebuilt AAR in the tree (Firebase, the MLKit
        // barcode scanner) ships .so files for every ABI it supports, and those
        // get packaged whatever that property says. Inspecting a CI-built APK
        // showed five ABIs in it (arm64-v8a, armeabi, armeabi-v7a, x86, x86_64)
        // despite a build that asked for two.
        //
        // abiFilters is the switch that actually applies to all of them. Driven
        // off the same property so there is still one place to say it:
        //   ./gradlew assembleSignetRelease -PreactNativeArchitectures=x86_64
        ndk {
            abiFilters.clear()
            abiFilters.addAll(
                (project.findProperty('reactNativeArchitectures')
                    ?: 'arm64-v8a,armeabi-v7a')
                    .toString().split(',').collect { it.trim() }.findAll { it }
            )
        }
    }

    // One flavor per network. Each maps to its own env file (envConfigFiles
    // above) and its own applicationId + launcher label, so mainnet and signet
    // builds can be installed side by side.
    flavorDimensions "network"
    productFlavors {
        // verifyHost fills the App Link intent-filter in AndroidManifest.xml.
        // It MUST equal the host of SILNT_FRONTEND_URL on the LNbits instance
        // this flavor talks to, because that is the host the backend puts in
        // verification emails. A mismatch is silent: Android never verifies the
        // link, and it keeps opening in a browser (which still works).
        //
        // Both are signet.whispawallet.com today because that is what both
        // backends are configured with, following the WhiSPa rename. When the
        // mainnet backend gets its own frontend URL, change mainnet here to
        // match — and see the note in BUILD_ANDROID.md about why a mainnet
        // backend pointing at the signet frontend cannot complete a
        // registration.
        //
        // Sharing one host means both applicationIds claim the same URL, so
        // that host's assetlinks.json must list BOTH packages (an array of
        // statements) or the flavor missing from it falls back to the browser.
        // With both installed and both listed, Android asks the user which app
        // to open — unavoidable while they share a host.
        //
        // The applicationId moved to com.whispawallet.app, and NOT lightly:
        // it is the app's identity to every device that has the app installed,
        // so the change ships a SECOND app that cannot update over the first.
        // It was done while the only install was the author's. Do not do it
        // again once there are users without a migration for them.
        //
        // The NAMESPACE above deliberately stayed com.thrilla_btc.thrilla. It
        // is where BuildConfig and R are generated and where the Kotlin
        // sources live; nothing outside the build sees it, and moving it would
        // relocate every source file for no user-visible gain. That is also
        // why build_config_package above is pinned to the namespace rather
        // than to the applicationId — react-native-config looks BuildConfig up
        // by name, and it is not under the applicationId.
        mainnet {
            dimension "network"
            resValue "string", "app_name", "WhiSPa"
            manifestPlaceholders = [verifyHost: "signet.whispawallet.com"]
        }
        signet {
            dimension "network"
            applicationIdSuffix ".signet"
            resValue "string", "app_name", "WhiSPa Signet"
            manifestPlaceholders = [verifyHost: "signet.whispawallet.com"]
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Release signing. The keystore and passwords are NEVER committed — they
        // are read from Gradle properties (put them in ~/.gradle/gradle.properties,
        // outside this repo):
        //   WHISPA_STORE_FILE=/absolute/path/to/whispa-release.jks
        //   WHISPA_KEY_ALIAS=whispa
        //   WHISPA_STORE_PASSWORD=…
        //   WHISPA_KEY_PASSWORD=…
        //
        // THRILLA_* IS STILL READ, as a fallback, and that is not tidiness —
        // these names live in people's ~/.gradle/gradle.properties and in the
        // CI secrets, so renaming them without a fallback breaks the build on
        // every machine that has not been edited yet. Set either; WHISPA_*
        // wins when both are present.
        //
        // -storetype JKS IS NOT OPTIONAL if you want zapstore's `zsp` to read
        // this keystore. keytool on JDK 9+ writes PKCS12 by default, and a
        // PKCS12 file handed to a JKS reader fails on its magic bytes —
        // "invalid magic", whatever the password is, because the format is
        // wrong before the password is ever tried. JKS begins feedfeed;
        // PKCS12 begins 3082. Check an existing one with:
        //   head -c 4 <keystore> | od -An -tx1
        //
        // Generate the keystore once with:
        //   keytool -genkeypair -v -keystore whispa-release.jks -storetype JKS \
        //           -alias whispa -keyalg RSA -keysize 4096 -validity 10000
        //
        // CHANGING THE KEY IS NOT A RENAME. Android refuses an APK signed by a
        // different certificate than the installed one, so a new KEY orphans
        // every install — they have to uninstall, which for a wallet is the
        // app's data gone. Converting an existing keystore keeps the key:
        //   keytool -importkeystore -srckeystore old.keystore \
        //           -destkeystore whispa-release.jks -deststoretype JKS
        // hasProperty() is not a sufficient guard, and CI proved it: an empty
        // ORG_GRADLE_PROJECT_THRILLA_STORE_FILE= (which is what an unset GitHub
        // secret interpolates to) DEFINES the property with an empty value, so
        // hasProperty was true and file('') threw "path may not be null or
        // empty string". Require all four to be non-blank instead, so a
        // half-configured environment falls back to debug signing rather than
        // failing the build.
        release {
            if (releaseSigningReady) {
                storeFile     file(releaseSigning.STORE_FILE)
                storePassword releaseSigning.STORE_PASSWORD
                keyAlias      releaseSigning.KEY_ALIAS
                keyPassword   releaseSigning.KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // The SAME boolean signingConfigs.release was filled from — see the
            // note above `android {`. Asking the question a second time here is
            // what shipped debug-signed release APKs for a week.
            signingConfig releaseSigningReady ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:flipper-integration")

    // FileProvider, for handing a downloaded APK to Android's installer
    // (updater/ApkInstallerModule.kt). React Native pulls androidx.core in
    // transitively, so this usually resolves without being asked for — declared
    // anyway, because "it happens to be on the classpath" is not a thing to
    // rely on for the only code path that installs software. 1.12.0 matches
    // compileSdk 34; Gradle takes the higher of this and React Native's.
    implementation("androidx.core:core:1.12.0")

    // QR scanning (scanner/ZxingScannerModule.kt).
    //
    // ZXing, not MLKit, and that is the point rather than a preference.
    // react-native-camera-kit scanned through com.google.mlkit:barcode-scanning,
    // which ships libbarhopper_v3.so and .tflite models — closed binaries
    // F-Droid will not build. zxing-android-embedded is Apache 2.0 over ZXing
    // core, pulls in no Google Play Services, and is what most FOSS Android
    // scanners use. See FDROID.md.
    //
    // camera-kit is still a dependency: it serves iOS, where its podspec needs
    // React-Core alone and the decode is AVFoundation's. It is excluded from
    // ANDROID autolinking in react-native.config.js.
    implementation("com.journeyapps:zxing-android-embedded:4.3.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)

// Firebase Cloud Messaging (push). Apply the google-services plugin ONLY when
// the config file is present, so builds still work before Firebase is set up.
// Add android/app/google-services.json from your Firebase project to enable push.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}
