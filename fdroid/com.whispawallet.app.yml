# The f-droid.org submission: copy this to
# metadata/com.whispawallet.app.yml in a fork of gitlab.com/fdroid/fdroiddata
# and open a merge request. Nothing in this repo reads it — it lives here so it
# is versioned alongside the build it describes, because every Builds: entry
# below is a claim about android/app/build.gradle that goes stale silently.
#
# This is SEPARATE from the self-hosted repo in FDROID.md. That one serves our
# own index at fdroid.whispawallet.com and has no connection to f-droid.org.
#
# RUN `fdroid rewritemeta com.whispawallet.app` IN THE FORK AFTER COPYING.
# fdroiddata's CI enforces the canonical form, and rewritemeta produces it:
# it reorders the fields and STRIPS EVERY COMMENT BELOW. That is fine — the
# comments are our record, not theirs. Verified: rewriting loses no field.
# `AuthorName` sorts between `License` and `WebSite` — taken from the tool, not
# guessed, since nothing else states the order.
#
# DO NOT COMMIT THE OUTPUT OF A LOCAL 2.4.5 REWRITE. That version wraps long
# values onto a second line AND leaves a trailing space where it breaks, which
# .canonical.yml beside this file does not have — so the formatting is version
# skew against fdroiddata's CI rather than the canonical form. The canonical
# copy here is kept byte-for-byte in the style the fork produced; if CI ever
# disagrees, its rewrite is the authority, not ours.
#
# Checked against fdroidserver 2.4.5 with fdroiddata's own config/categories.yml:
# `fdroid readmeta` and `fdroid lint com.whispawallet.app` both pass clean —
# and note what lint does NOT catch, since both got through it: a tag in
# `commit:` and a missing `AuthorName`.
# versionCode/versionName/applicationId below were read out of the published
# v0.5.0 APK, not from build.gradle, so they match what Binaries points at.

# Validated against fdroiddata's config/categories.yml, which is the list
# `fdroid lint` checks and which has 116 entries. "Money" — the obvious guess,
# and what the old flat list had — is not among them any more and fails lint.
Categories:
  - Wallet
License: MIT

# Required by the fdroiddata new-app checklist ("An AuthorName must be added.
# It doesn't need to be the real name."). fdroid lint does NOT check for it —
# it passes clean without one — so nothing but the reviewer catches its
# absence, which is how the submission sat with the box ticked and the field
# missing. It sorts HERE, between License and WebSite: taken from rewritemeta's
# own output, and check:fdroid pins the two files to the same order.
AuthorName: ponthief

WebSite: https://whispawallet.com
SourceCode: https://github.com/ponthief/whispa
IssueTracker: https://github.com/ponthief/whispa/issues
Changelog: https://github.com/ponthief/whispa/releases

AutoName: WhiSPa

RepoType: git
Repo: https://github.com/ponthief/whispa.git

# PUBLISH OUR APK, NOT THEIRS. Without this pair F-Droid signs its own build
# with its own key, which is a different app to Android: nobody on an existing
# install can update to it, and for a wallet that is a reinstall and a restore
# from the seed phrase for every user.
#
# With it, F-Droid builds from source, downloads this binary, and compares.
# build.py:1245 — a mismatch raises, deletes the built APK and FAILS the build.
# It does not fall back to publishing theirs. So a build that is not yet
# reproducible costs a failed build, never a wrong-key release.
#
# %v is versionName, so v%v resolves to the tag.
Binaries: https://github.com/ponthief/whispa/releases/download/v%v/whispa-mainnet.apk

Builds:
  - versionName: 0.5.0
    versionCode: 500
    # THE FULL HASH, not the tag. The checklist is explicit — "The `commit`
    # field should be the full hash. Please don't use tag or branch in commit."
    # — and `fdroid lint` does not enforce it, so `commit: v0.5.0` passed every
    # local check and only a reviewer saw it. This is `git rev-parse
    # v0.5.0^{commit}`; UpdateCheckMode: Tags still finds the next release.
    commit: 4b16735e0b52d2ebfd4900e53948951b91ec57e6
    subdir: android/app
    ndk: r25b

    # NODE FROM DEBIAN, on the reviewer's instruction (seekme-seekyou,
    # 2026-11-03: "install node from debian"). The buildserver is Debian trixie,
    # where apt gives nodejs 20.19.2 and npm 9.2.0 — package.json asks for
    # node >=18 and package-lock.json is lockfileVersion 3, which npm 7+ reads,
    # so both are satisfied and the explicit `npm -g install npm@10.8.2` is no
    # longer needed.
    #
    # WHAT THIS GAVE UP, recorded because it is the one thing that could fail
    # the build. The previous version downloaded node 20.20.2 from nodejs.org
    # against a sha256, to match .nvmrc exactly, on the reasoning that the
    # Binaries comparison above needs byte-identical output and a different
    # node or npm can change it. Against that: hermesc ships in the
    # react-native package and `npm ci` on a lockfileVersion 3 lock pins the
    # whole tree, so the bytecode and the dependency set come from the lockfile
    # rather than from node — a 20.19-against-20.20 difference is unlikely to
    # move either. Unlikely is not verified, and only a real build settles it;
    # the MR's pipeline has never run (no runner), so nothing here has been
    # build-tested yet. If the reproducible-build comparison fails, this block
    # is the first thing to put back, and the MR reply says so.
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm

    # prebuild runs in build_dir/subdir — android/app — not the repo root
    # (common.py:2484). Hence the ../.. on both lines.
    prebuild:
      # WHISPA_NO_PUSH=1 is how `npm run apk:fdroid` drops Firebase, and it is
      # an ENVIRONMENT variable read by react-native.config.js during
      # autolinking. A Build: entry has no env field (metadata.py build_flags),
      # and prebuild's own environment does not reach the later gradle step, so
      # the flag cannot be passed — it has to be burned into the file.
      - sed -i "s/process.env.WHISPA_NO_PUSH === '1'/true/" ../../react-native.config.js
      - cd ../.. && npm ci

    # node_modules carries prebuilt binaries that the scanner rejects; they are
    # build-time only and nothing from them is packaged.
    scandelete:
      - node_modules

    # assembleMainnetRelease. The signet flavor is a testnet build and is not
    # published here.
    gradle:
      - mainnet

# SHA-256 of the signing certificate, read from the published v0.5.0
# whispa-mainnet.apk (META-INF/CERT.RSA). This is the app's permanent identity
# to Android — it cannot be rotated without every user reinstalling.
AllowedAPKSigningKeys: 3a7546982c4d256c6024f410d94b9209bafdf1fcf8df7b8f0a9f344fd1d4562f

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 0.5.0
CurrentVersionCode: 500
