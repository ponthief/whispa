# Zapstore publishing config for the MAINNET build of WhiSPa.
#
#   zsp publish --check                 # validate first
#   SIGN_WITH=nsec1... zsp publish
#
# The Signet build has its own config — see ./zapstore.signet.yaml.
#
# THE APPLICATION ID CHANGED, and on Zapstore that is the whole story. zsp
# takes the `d` tag of the kind 32267 event straight from the APK's package
# identifier, so an app's identity on the relay is its applicationId and
# nothing else. android/app/build.gradle now sets com.whispawallet.app (the
# NAMESPACE deliberately stayed com.thrilla_btc.thrilla — that is where
# BuildConfig and R are generated and nothing outside the build sees it).
#
# So publishing this does not rename the old listing, it creates a second one,
# exactly as it installs as a second app on a phone. The com.thrilla_btc.thrilla
# entry has to be dealt with separately — see RELEASING.md.
#
# This comment used to claim the applicationId was still com.thrilla_btc.thrilla.
# It was out of date by the time anybody read it, which is the one thing that
# would send you looking for an update path that does not exist.
repository: https://github.com/ponthief/whispa
name: WhiSPa
summary: Bitcoin Silent Payments wallet
description: |
  Self-custodial Bitcoin wallet with support for Silent Payments — on-chain
  privacy when receiving. One reusable address that never has to be reused on
  chain.

  Keys are derived on the device and stay there: transactions are built and
  signed on the phone, so no key is ever sent to a server.
tags:
    - bitcoin
    - wallet
    - silentpayments
    - self-custody
license: MIT
website: https://whispawallet.com
images:
    - screenshots
# The published release, not a local build. /releases/latest/download/<name>
# always resolves to the newest non-prerelease asset by that name, which is the
# same URL the download page on the website points at. Naming the asset matters:
# every release carries the mainnet and Signet APKs side by side, so without it
# there is nothing to say which one this is.
release_source: https://github.com/ponthief/whispa/releases/latest/download/whispa-mainnet.apk
# zsp pulls the section whose version matches the APK — which reports the
# BUILD number (0.4.0), not the release name (0.1.0-beta). CHANGELOG.md says
# why its headings are numbered that way.
release_notes: CHANGELOG.md
metadata_sources:
    - github
