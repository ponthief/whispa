# Zapstore publishing config for the SIGNET (test-network) build of WhiSPa.
# Kept separate from ./zapstore.yaml (the mainnet config). Publish it with the
# config path as a positional argument:
#
#   zsp publish --check zapstore.signet.yaml     # validate first
#   SIGN_WITH=nsec1... zsp publish zapstore.signet.yaml
#
# Signet is a separate package (com.whispawallet.app.signet — the mainnet
# applicationId plus the flavor's applicationIdSuffix), so it lists as its own
# app alongside the mainnet build. zsp takes the kind 32267 `d` tag from the
# APK's package identifier, so that suffix is what keeps the two apart. The first publish links the release
# signing certificate to your pubkey via your .jks.
repository: https://github.com/ponthief/whispa
name: WhiSPa (Signet)
summary: Bitcoin Silent Payments wallet — Signet test build
description: |
  Self-custodial Bitcoin wallet with support for Silent Payments — on-chain
  privacy when receiving. Keys are derived on the device and stay there:
  transactions are built and signed on the phone, so no key is ever sent to a
  server.

  This is the SIGNET (test network) build — it does NOT hold real bitcoin. Use
  it to try WhiSPa on Signet. For real funds, use the mainnet build.
tags:
    - bitcoin
    - wallet
    - silentpayments
    - self-custody
    - signet
license: MIT
website: https://whispawallet.com
images:
    - screenshots
# The published release, not a local build. /releases/latest/download/<name>
# always resolves to the newest non-prerelease asset by that name, which is the
# same URL the download page on the website points at — so publishing here does
# not depend on whatever happens to be in android/app/build/outputs.
#
# Naming the asset matters: every release carries both APKs, and picking up
# whispa-mainnet.apk here would list the mainnet build under the Signet package.
release_source: https://github.com/ponthief/whispa/releases/latest/download/whispa-signet.apk
# zsp pulls the section whose version matches the APK — which reports the
# BUILD number (0.4.0), not the release name (0.1.0-beta). CHANGELOG.md says
# why its headings are numbered that way.
release_notes: CHANGELOG.md
metadata_sources:
    - github
pubkey: npub1cfm900wdm4p0sky6tz3uhjdcdxsca3l94q5rclzxtxqke7gzenssthhk2w
