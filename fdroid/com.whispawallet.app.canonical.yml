      - npm -g install npm@10.8.2
    gradle:
      - mainnet
    prebuild:
      - sed -i "s/process.env.WHISPA_NO_PUSH === '1'/true/" ../../react-native.config.js
      - cd ../.. && npm ci
    scandelete:
      - node_modules
    ndk: r25b

